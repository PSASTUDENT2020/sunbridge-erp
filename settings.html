<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>School Settings - Sunbridge ERP</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-100 font-sans min-h-screen p-4 md:p-8">
  <div class="max-w-4xl mx-auto bg-white p-6 rounded-xl shadow-md border border-gray-200">
    
    <!-- Top Navigation -->
    <header class="border-b pb-4 mb-6 flex justify-between items-center">
      <div class="flex items-center space-x-3">
        <img id="header-logo" src="" class="h-10 w-10 object-contain hidden border rounded p-1">
        <div>
          <h1 id="header-school-name" class="text-xl font-bold text-gray-800">Sunbridge Human Academy</h1>
          <p class="text-xs text-gray-500">System Configuration & Branding</p>
        </div>
      </div>
      <div class="flex items-center space-x-2">
        <a href="dashboard.html" class="text-sm bg-gray-200 hover:bg-gray-300 text-gray-700 font-medium px-4 py-2 rounded-lg transition-colors">Dashboard</a>
        <button onclick="logout()" class="text-sm bg-red-500 hover:bg-red-600 text-white font-medium px-4 py-2 rounded-lg transition-colors">Log Out</button>
      </div>
    </header>

    <h2 class="text-lg font-bold text-gray-800 mb-4">Edit School Information</h2>

    <!-- Settings Form -->
    <form onsubmit="saveSchoolSettings(event)" class="space-y-4 max-w-xl">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">School Name</label>
        <input id="set-name" type="text" required class="w-full p-2.5 border rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">
      </div>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Phone Number</label>
          <input id="set-phone" type="text" required class="w-full p-2.5 border rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Official Email</label>
          <input id="set-email" type="email" required class="w-full p-2.5 border rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">
        </div>
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Physical Address</label>
        <textarea id="set-address" rows="2" class="w-full p-2.5 border rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none"></textarea>
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">School Logo</label>
        <div class="flex items-center space-x-4">
          <img id="current-logo-preview" src="" class="h-12 w-12 object-contain border rounded p-1 hidden">
          <input id="set-logo-file" type="file" accept="image/*" class="w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100 cursor-pointer">
        </div>
      </div>

      <button type="submit" id="save-settings-btn" class="bg-blue-600 hover:bg-blue-700 text-white font-medium px-6 py-2.5 rounded-lg transition-colors">
        Save Changes
      </button>
    </form>

  </div>

  <script src="app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      loadSchoolSettingsForm();
    });
  </script>
</body>
</html>
