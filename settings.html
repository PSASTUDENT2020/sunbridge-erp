<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Settings - Sunbridge ERP</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-50 font-sans min-h-screen">
  <header class="bg-emerald-900 text-white shadow-md sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 flex justify-between items-center h-16">
      <span class="text-xl font-bold">Sunbridge ERP</span>
      <nav class="flex space-x-4 text-sm font-medium">
        <a href="dashboard.html" class="hover:bg-emerald-800 px-3 py-2 rounded-md">Dashboard</a>
        <a href="settings.html" class="bg-emerald-800 px-3 py-2 rounded-md">Settings</a>
        <button onclick="logout()" class="bg-red-600 hover:bg-red-700 px-3 py-2 rounded-md">Logout</button>
      </nav>
    </div>
  </header>

  <main class="max-w-4xl mx-auto px-4 py-8">
    <div class="bg-white p-6 rounded-xl shadow border space-y-6">
      <h2 class="text-xl font-bold text-gray-900">Global School & Branding Configuration</h2>
      <form onsubmit="saveSchoolSettings(event);" class="space-y-4">
        <div><label class="text-xs font-semibold">Institution Name</label><input id="set-name" class="w-full p-2.5 border rounded-lg text-sm"></div>
        <div class="grid grid-cols-2 gap-4">
          <div><label class="text-xs font-semibold">Official Phone</label><input id="set-phone" class="w-full p-2 border rounded-lg text-sm"></div>
          <div><label class="text-xs font-semibold">Official Email</label><input id="set-email" class="w-full p-2 border rounded-lg text-sm"></div>
        </div>
        <div><label class="text-xs font-semibold">Physical Address</label><textarea id="set-address" class="w-full p-2 border rounded-lg text-sm"></textarea></div>
        <div><label class="text-xs font-semibold">Update Logo Assets</label><input type="file" id="set-logo-file" class="w-full text-xs"></div>
        <button type="submit" id="save-settings-btn" class="bg-emerald-800 text-white px-5 py-2.5 rounded-lg text-sm font-medium">Save Settings</button>
      </form>
    </div>
  </main>
  <script src="app.js"></script>
</body>
</html>
