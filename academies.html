<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Academies & Finance - Sunbridge ERP</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-100 font-sans min-h-screen p-4 md:p-8">
  <div class="max-w-6xl mx-auto bg-white p-6 rounded-xl shadow-md border border-gray-200">
    
    <!-- Top Navigation -->
    <header class="border-b pb-4 mb-6 flex justify-between items-center">
      <div class="flex items-center space-x-3">
        <img id="header-logo" src="" class="h-10 w-10 object-contain hidden border rounded p-1">
        <div>
          <h1 id="header-school-name" class="text-xl font-bold text-gray-800">Sunbridge Human Academy</h1>
          <p class="text-xs text-gray-500">Branch & Finance Officer Management</p>
        </div>
      </div>
      <div class="flex items-center space-x-2">
        <a href="dashboard.html" class="text-sm bg-gray-200 hover:bg-gray-300 text-gray-700 font-medium px-4 py-2 rounded-lg transition-colors">Dashboard</a>
        <button onclick="logout()" class="text-sm bg-red-500 hover:bg-red-600 text-white font-medium px-4 py-2 rounded-lg transition-colors">Log Out</button>
      </div>
    </header>

    <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
      
      <!-- Add Academy & Finance Officer Form -->
      <div class="bg-gray-50 p-5 rounded-xl border border-gray-200">
        <h2 class="text-lg font-bold text-gray-800 mb-4">Add New Branch</h2>
        <form onsubmit="saveAcademy(event)" class="space-y-4">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Branch Name</label>
            <input id="academy-name" type="text" required placeholder="Main Campus" class="w-full p-2.5 border rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">
          </div>

          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Branch Code</label>
            <input id="academy-code" type="text" required placeholder="MC-01" class="w-full p-2.5 border rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">
          </div>

          <hr class="my-4 border-gray-300">
          <h3 class="text-sm font-bold text-gray-700 uppercase tracking-wider">Finance Person Details</h3>

          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Finance Person Name</label>
            <input id="finance-name" type="text" placeholder="John Doe" class="w-full p-2.5 border rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">
          </div>

          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Finance Email</label>
            <input id="finance-email" type="email" placeholder="finance@branch.edu" class="w-full p-2.5 border rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">
          </div>

          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Finance Phone</label>
            <input id="finance-phone" type="text" placeholder="+1 234 567 890" class="w-full p-2.5 border rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">
          </div>

          <button type="submit" id="save-academy-btn" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-medium py-2.5 rounded-lg transition-colors">
            Add Branch & Assign Finance
          </button>
        </form>
      </div>

      <!-- Academy List Table -->
      <div class="lg:col-span-2">
        <h2 class="text-lg font-bold text-gray-800 mb-4">Existing Branches & Finance Contacts</h2>
        <div class="overflow-x-auto border rounded-xl">
          <table class="w-full text-left text-sm text-gray-600">
            <thead class="bg-gray-100 text-gray-700 uppercase text-xs">
              <tr>
                <th class="p-3 border-b">Branch</th>
                <th class="p-3 border-b">Code</th>
                <th class="p-3 border-b">Finance Officer</th>
                <th class="p-3 border-b">Contact</th>
              </tr>
            </thead>
            <tbody id="academies-table-body">
              <tr>
                <td colspan="4" class="p-4 text-center text-gray-400">Loading branches...</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>

    </div>

  </div>

  <script src="app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      loadAcademiesList();
    });
  </script>
</body>
</html>
