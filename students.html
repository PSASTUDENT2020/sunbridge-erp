<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Students - Sunbridge ERP</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-50 font-sans min-h-screen">
  <header class="bg-emerald-900 text-white shadow-md sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 flex justify-between items-center h-16">
      <span class="text-xl font-bold">Sunbridge ERP</span>
      <nav class="flex space-x-4 text-sm font-medium">
        <a href="dashboard.html" class="hover:bg-emerald-800 px-3 py-2 rounded-md">Dashboard</a>
        <a href="students.html" class="bg-emerald-800 px-3 py-2 rounded-md">Students</a>
        <a href="staff.html" class="hover:bg-emerald-800 px-3 py-2 rounded-md">Staff & Payroll</a>
        <a href="finance.html" class="hover:bg-emerald-800 px-3 py-2 rounded-md">Finance</a>
        <button onclick="logout()" class="bg-red-600 hover:bg-red-700 px-3 py-2 rounded-md">Logout</button>
      </nav>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 py-8">
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
      <div class="bg-white p-6 rounded-xl shadow border">
        <h2 class="text-lg font-bold mb-4">Enroll New Student</h2>
        <form onsubmit="return saveStudent(event);" class="space-y-4">
          <div><label class="text-xs font-semibold">Branch</label><select id="student-academy-select" required class="w-full p-2 border rounded-lg text-sm"></select></div>
          <div><label class="text-xs font-semibold">Full Name</label><input id="student-name" required class="w-full p-2 border rounded-lg text-sm"></div>
          <div><label class="text-xs font-semibold">Roll Number</label><input id="student-roll" required class="w-full p-2 border rounded-lg text-sm"></div>
          <div><label class="text-xs font-semibold">Class / Grade</label><input id="student-grade" required class="w-full p-2 border rounded-lg text-sm"></div>
          <div><label class="text-xs font-semibold">Guardian Phone</label><input id="student-phone" required class="w-full p-2 border rounded-lg text-sm"></div>
          <button type="submit" id="save-student-btn" class="w-full bg-emerald-800 text-white py-2 rounded-lg text-sm">Enroll Student</button>
        </form>
      </div>

      <div class="lg:col-span-2 bg-white p-6 rounded-xl shadow border">
        <div class="flex justify-between items-center mb-4">
          <h2 class="text-lg font-bold">Student Roster</h2>
          <input id="student-search-input" oninput="filterStudents()" placeholder="Search..." class="p-2 border rounded-lg text-sm">
        </div>
        <table class="w-full text-left text-sm border-collapse">
          <thead>
            <tr class="bg-gray-50 border-b">
              <th class="p-3">Roll #</th>
              <th class="p-3">Name</th>
              <th class="p-3">Class</th>
              <th class="p-3">Guardian Contact</th>
            </tr>
          </thead>
          <tbody id="students-table-body"></tbody>
        </table>
      </div>
    </div>
  </main>
  <script src="app.js"></script>
</body>
</html>
