<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Directory - Sunbridge ERP</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-100 font-sans min-h-screen p-4 md:p-8">
  <div class="max-w-6xl mx-auto bg-white p-6 rounded-xl shadow-md border border-gray-200">
    
    <!-- Top Navigation -->
    <header class="border-b pb-4 mb-6 flex justify-between items-center">
      <div class="flex items-center space-x-3">
        <img id="header-logo" src="" class="h-10 w-10 object-contain hidden border rounded p-1">
        <div>
          <h1 id="header-school-name" class="text-xl font-bold text-gray-800">Sunbridge Human Academy</h1>
          <p class="text-xs text-gray-500">Student Directory & Enrollment</p>
        </div>
      </div>
      <div class="flex items-center space-x-2">
        <a href="dashboard.html" class="text-sm bg-gray-200 hover:bg-gray-300 text-gray-700 font-medium px-4 py-2 rounded-lg transition-colors">Dashboard</a>
        <button onclick="logout()" class="text-sm bg-red-500 hover:bg-red-600 text-white font-medium px-4 py-2 rounded-lg transition-colors">Log Out</button>
      </div>
    </header>

    <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
      
      <!-- Enroll Student Form -->
      <div class="bg-gray-50 p-5 rounded-xl border border-gray-200">
        <h2 class="text-lg font-bold text-gray-800 mb-4">Add New Student</h2>
        <form onsubmit="saveStudent(event)" class="space-y-4">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Assign Academy / Branch</label>
            <select id="student-academy-select" required class="w-full p-2.5 border rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none bg-white">
              <option value="">Loading branches...</option>
            </select>
          </div>

          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Full Name</label>
            <input id="student-name" type="text" required placeholder="Jane Doe" class="w-full p-2.5 border rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">
          </div>

          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Roll / Admission Number</label>
            <input id="student-roll" type="text" required placeholder="STU-2026-001" class="w-full p-2.5 border rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">
          </div>

          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Class / Grade</label>
            <input id="student-grade" type="text" placeholder="Grade 8 - Section A" class="w-full p-2.5 border rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">
          </div>

          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Guardian Phone Number</label>
            <input id="student-phone" type="text" placeholder="+1 234 567 890" class="w-full p-2.5 border rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">
          </div>

          <button type="submit" id="save-student-btn" class="w-full bg-purple-600 hover:bg-purple-700 text-white font-medium py-2.5 rounded-lg transition-colors">
            Enroll Student
          </button>
        </form>
      </div>

      <!-- Student Directory Table -->
      <div class="lg:col-span-2">
        <div class="flex justify-between items-center mb-4">
          <h2 class="text-lg font-bold text-gray-800">Enrolled Students</h2>
          <input id="student-search-input" onkeyup="filterStudents()" type="text" placeholder="Search by name or roll..." class="p-2 border rounded-lg text-sm w-48 md:w-64 focus:ring-2 focus:ring-blue-500 focus:outline-none">
        </div>

        <div class="overflow-x-auto border rounded-xl">
          <table class="w-full text-left text-sm text-gray-600">
            <thead class="bg-gray-100 text-gray-700 uppercase text-xs">
              <tr>
                <th class="p-3 border-b">Roll No</th>
                <th class="p-3 border-b">Name</th>
                <th class="p-3 border-b">Branch</th>
                <th class="p-3 border-b">Class / Grade</th>
                <th class="p-3 border-b">Guardian Phone</th>
              </tr>
            </thead>
            <tbody id="students-table-body">
              <tr>
                <td colspan="5" class="p-4 text-center text-gray-400">Loading directory...</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>

    </div>

  </div>

  <script src="app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      loadAcademyDropdown();
      loadStudentsList();
    });
  </script>
</body>
</html>
