<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - Sunbridge ERP</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-50 font-sans text-gray-800 min-h-screen">
  <header class="bg-emerald-900 text-white shadow-md sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 flex justify-between items-center h-16">
      <div class="flex items-center space-x-3">
        <span class="text-xl font-bold">Sunbridge ERP</span>
        <span class="bg-emerald-800 text-emerald-200 text-xs px-2.5 py-1 rounded-full">Executive Suite</span>
      </div>
      <nav class="flex space-x-4 text-sm font-medium">
        <a href="dashboard.html" class="bg-emerald-800 px-3 py-2 rounded-md">Dashboard</a>
        <a href="students.html" class="hover:bg-emerald-800 px-3 py-2 rounded-md">Students</a>
        <a href="staff.html" class="hover:bg-emerald-800 px-3 py-2 rounded-md">Staff & Payroll</a>
        <a href="finance.html" class="hover:bg-emerald-800 px-3 py-2 rounded-md">Finance</a>
        <a href="settings.html" class="hover:bg-emerald-800 px-3 py-2 rounded-md">Settings</a>
        <button onclick="logout()" class="bg-red-600 hover:bg-red-700 px-3 py-2 rounded-md">Logout</button>
      </nav>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 py-8">
    <h1 class="text-2xl font-bold mb-6">Executive Overview</h1>
    <div class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-8">
      <div class="bg-white p-6 rounded-xl shadow-sm border"><p class="text-sm text-gray-500">Total Students</p><h3 id="dash-students" class="text-3xl font-bold mt-1">...</h3></div>
      <div class="bg-white p-6 rounded-xl shadow-sm border"><p class="text-sm text-gray-500">Active Staff</p><h3 id="dash-staff" class="text-3xl font-bold mt-1">...</h3></div>
      <div class="bg-white p-6 rounded-xl shadow-sm border"><p class="text-sm text-gray-500">Total Receivables</p><h3 id="dash-receivables" class="text-3xl font-bold text-amber-600 mt-1">...</h3></div>
      <div class="bg-white p-6 rounded-xl shadow-sm border"><p class="text-sm text-gray-500">Payroll Expenses</p><h3 id="dash-expenses" class="text-3xl font-bold text-red-600 mt-1">...</h3></div>
    </div>
  </main>
  <script src="app.js"></script>
</body>
</html>
