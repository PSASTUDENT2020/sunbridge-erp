<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - Sunbridge ERP</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-100 font-sans min-h-screen p-4 md:p-8">
  <div class="max-w-6xl mx-auto bg-white p-6 rounded-xl shadow-md border border-gray-200">
    
    <!-- Top Navigation -->
    <header class="border-b pb-4 mb-6 flex justify-between items-center">
      <div class="flex items-center space-x-3">
        <img id="header-logo" src="" class="h-10 w-10 object-contain hidden border rounded p-1">
        <div>
          <h1 id="header-school-name" class="text-xl font-bold text-gray-800">Sunbridge Human Academy</h1>
          <p class="text-xs text-gray-500">Management Overview</p>
        </div>
      </div>
      <div class="flex items-center space-x-2">
        <a href="settings.html" class="text-sm bg-gray-200 hover:bg-gray-300 text-gray-700 font-medium px-4 py-2 rounded-lg transition-colors">Settings</a>
        <button onclick="logout()" class="text-sm bg-red-500 hover:bg-red-600 text-white font-medium px-4 py-2 rounded-lg transition-colors">Log Out</button>
      </div>
    </header>

    <!-- System Navigation Cards -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
      <a href="settings.html" class="p-6 border rounded-xl hover:shadow-lg transition-shadow bg-blue-50 border-blue-200 block">
        <h3 class="text-lg font-bold text-blue-900 mb-1">School Branding</h3>
        <p class="text-sm text-blue-700">Update logo, contact info, and name.</p>
      </a>

      <a href="academies.html" class="p-6 border rounded-xl hover:shadow-lg transition-shadow bg-emerald-50 border-emerald-200 block">
        <h3 class="text-lg font-bold text-emerald-900 mb-1">Branch Management</h3>
        <p class="text-sm text-emerald-700">Manage school locations & academies.</p>
      </a>

      <a href="students.html" class="p-6 border rounded-xl hover:shadow-lg transition-shadow bg-purple-50 border-purple-200 block">
        <h3 class="text-lg font-bold text-purple-900 mb-1">Student Directory</h3>
        <p class="text-sm text-purple-700">Add, search, and assign students.</p>
      </a>
    </div>

  </div>

  <script src="app.js"></script>
</body>
</html>
