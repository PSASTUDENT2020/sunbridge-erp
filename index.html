<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sunbridge Human Academy ERP</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Supabase JS Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-100 font-sans min-h-screen p-4 md:p-8">

  <div class="max-w-4xl mx-auto bg-white p-6 md:p-8 rounded-xl shadow-md border border-gray-200">
    <!-- Header -->
    <header class="border-b pb-4 mb-6">
      <h1 class="text-2xl md:text-3xl font-bold text-gray-800">Sunbridge Human Academy</h1>
      <p class="text-sm text-gray-500 mt-1">Multi-Branch ERP Administrative Portal</p>
    </header>

    <!-- Login Form -->
    <div id="login-box" class="space-y-4 max-w-md mx-auto py-6">
      <h2 class="text-xl font-semibold text-gray-700 text-center">Super Admin Access</h2>
      <div>
        <label class="block text-sm font-medium text-gray-600 mb-1">Email Address</label>
        <input id="email" type="email" placeholder="admin@sunbridge.edu" class="w-full p-2.5 border rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-600 mb-1">Password</label>
        <input id="password" type="password" placeholder="••••••••" class="w-full p-2.5 border rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">
      </div>
      <button onclick="login()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2.5 rounded-lg transition-colors">Log In</button>
    </div>

    <!-- Admin Panel (Hidden until login) -->
    <div id="admin-box" class="hidden space-y-8">
      <!-- User Info Bar -->
      <div class="flex justify-between items-center bg-blue-50 p-4 rounded-lg border border-blue-100">
        <div>
          <p id="user-info" class="font-bold text-blue-900"></p>
          <p id="role-info" class="text-xs text-blue-700 uppercase tracking-wide font-semibold mt-0.5"></p>
        </div>
        <button onclick="logout()" class="bg-red-500 hover:bg-red-600 text-white px-4 py-1.5 rounded-lg text-sm transition-colors">Log Out</button>
      </div>

      <!-- Add New Academy Branch -->
      <section class="bg-gray-50 p-5 rounded-lg border space-y-4">
        <h3 class="font-semibold text-gray-800 text-lg">Create New Academy Branch</h3>
        <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
          <input id="academy-name" type="text" placeholder="Branch Name (e.g. Branch 2)" class="p-2.5 border rounded-lg focus:outline-none">
          <input id="academy-code" type="text" placeholder="Code (e.g. SHA-02)" class="p-2.5 border rounded-lg focus:outline-none">
          <button onclick="addAcademy()" class="bg-green-600 hover:bg-green-700 text-white font-medium px-4 py-2.5 rounded-lg transition-colors">Add Academy</button>
        </div>
      </section>

      <!-- Active Academies List -->
      <section class="space-y-3">
        <h3 class="text-lg font-semibold text-gray-800">Active Academies</h3>
        <ul id="academy-list" class="space-y-2 border rounded-lg p-4 bg-white divide-y"></ul>
      </section>

      <!-- Register Student Section -->
      <section class="bg-gray-50 p-5 rounded-lg border space-y-4">
        <h3 class="font-semibold text-gray-800 text-lg">Register New Student</h3>
        <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
          <select id="branch-select" class="p-2.5 border rounded-lg bg-white focus:outline-none">
            <option value="">Select Target Branch...</option>
          </select>
          <input id="student-name" type="text" placeholder="Full Name" class="p-2.5 border rounded-lg focus:outline-none">
          <input id="student-roll" type="text" placeholder="Roll Number" class="p-2.5 border rounded-lg focus:outline-none">
        </div>
        <button onclick="addStudent()" class="bg-indigo-600 hover:bg-indigo-700 text-white font-medium px-6 py-2.5 rounded-lg transition-colors">Register Student</button>
      </section>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
