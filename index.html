<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Sunbridge ERP</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-900 font-sans min-h-screen flex items-center justify-center p-4">
  <div class="max-w-md w-full bg-white p-8 rounded-2xl shadow-2xl border border-gray-100">
    <div class="text-center mb-8">
      <h1 class="text-3xl font-black text-slate-800 tracking-tight">Sunbridge ERP</h1>
      <p class="text-xs text-gray-500 mt-1 uppercase tracking-wider font-semibold">Multi-Branch Administration Access</p>
    </div>

    <form onsubmit="return login(event);" class="space-y-5">
      <div>
        <label class="block text-xs font-semibold text-gray-700 mb-1">Email Address</label>
        <input id="email" type="email" required placeholder="admin@sunbridge.edu" class="w-full p-3 border rounded-xl focus:ring-2 focus:ring-emerald-500 focus:outline-none text-sm bg-gray-50">
      </div>

      <div>
        <label class="block text-xs font-semibold text-gray-700 mb-1">Password</label>
        <input id="password" type="password" required placeholder="••••••••" class="w-full p-3 border rounded-xl focus:ring-2 focus:ring-emerald-500 focus:outline-none text-sm bg-gray-50">
      </div>

      <button type="submit" id="login-btn" class="w-full bg-emerald-800 hover:bg-emerald-900 text-white font-medium py-3 rounded-xl transition-all shadow-md">
        Log In
      </button>
    </form>
  </div>
  <script src="app.js"></script>
</body>
</html>
